<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Feedback form registration</title></head>
<body>
  <form name="tracker-feedback" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="tracker-feedback">
    <input name="bot-field">
    <textarea name="message"></textarea>
    <input type="file" name="image" accept="image/*">
    <input type="file" name="attachment">
  </form>
</body>
</html>
